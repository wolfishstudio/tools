name: Publicar Site (Pages)

on:
  push:
    branches: ["master"] # Ou "master", confirme o nome da sua branch principal
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Generate site version
        run: |
          version=$(sed -n 's:.*<WolfishMaiaVersion>\([^<]*\)</WolfishMaiaVersion>.*:\1:p' Version.props)
          package_url=$(sed -n 's:.*<WolfishMaiaPackageUrl>\([^<]*\)</WolfishMaiaPackageUrl>.*:\1:p' Version.props)
          {
            printf "window.WOLFISH_MAIA_VERSION = '%s';\n" "$version"
            printf "window.WOLFISH_MAIA_PACKAGE_URL = '%s';\n" "$package_url"
          } > public/version.js
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Build with Jekyll
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./public
          destination: ./_site
        env:
          JEKYLL_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
            path: ./_site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
